<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>e-Sahayak</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  #box { position: absolute; display: none; border: 4px solid #ff8a00; border-radius: 10px;
         box-shadow: 0 0 0 4px rgba(255,138,0,.25), 0 0 24px rgba(255,138,0,.6); animation: pulse 1.4s ease-in-out infinite; }
  #cap { position: absolute; display: none; max-width: 420px; padding: 6px 12px; border-radius: 8px;
         background: #1f2937; color: #fff; font: 600 15px -apple-system, "Noto Sans Devanagari", sans-serif;
         box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .cal { position: absolute; box-sizing: border-box; border: 2px solid #ff00d4; background: rgba(255,0,212,.12);
         color: #ff00d4; font: 700 11px Menlo, monospace; padding: 2px; }
  /* visible in recordings: plain outline, no glow/pulse, so our own pixels stay stable */
  body.recordable #box { animation: none; box-shadow: none; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: .75; } }
</style>
</head>
<body>
<div id="box"></div>
<div id="cap"></div>
<div id="calib"></div>
<script src="overlay.js"></script>
</body>
</html>
